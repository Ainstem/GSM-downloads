name: Validate preserved GSM Android APK
permissions:
  contents: write
  actions: read
concurrency:
  group: gsm-android-release
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Receive checksum-pinned test source without signing credentials
      env:
        GH_TOKEN: ${{ github.token }}
        GSM_SOURCE_ONLY: '1'
      run: 'python3 -m venv /tmp/gsm-transfer-env

        /tmp/gsm-transfer-env/bin/pip -q install cryptography==46.0.3

        /tmp/gsm-transfer-env/bin/python receive-android-transfer.py

        python3 build-android.py fetch

        '
    - name: Restore exact signed candidate from previous owned run
      uses: actions/download-artifact@v4
      with:
        name: gsm-android-validation-44669804196
        run-id: 44669804196
        github-token: ${{ github.token }}
        path: .
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-36 build-tools;36.0.0
    - name: Verify preserved candidate signature and package
      run: python3 verify-android-candidate.py
    - name: Prepare owned emulator
      run: 'npm install --prefix "$RUNNER_TEMP/gsm-media-tools" --ignore-scripts --no-audit --no-fund @ffmpeg-installer/linux-x64@4.1.0
        @ffprobe-installer/linux-x64@5.2.0

        chmod +x "$RUNNER_TEMP/gsm-media-tools/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/gsm-media-tools/node_modules/@ffprobe-installer/linux-x64/ffprobe"

        "$RUNNER_TEMP/gsm-media-tools/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" -version

        "$RUNNER_TEMP/gsm-media-tools/node_modules/@ffprobe-installer/linux-x64/ffprobe" -version

        printf ''%s\n'' "$RUNNER_TEMP/gsm-media-tools/node_modules/@ffmpeg-installer/linux-x64" "$RUNNER_TEMP/gsm-media-tools/node_modules/@ffprobe-installer/linux-x64"
        >> "$GITHUB_PATH"

        echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Test navigation, decoded replay and print on Android
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        cores: 2
        ram-size: 2048M
        disable-animations: true
        emulator-boot-timeout: 300
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
        script: python source/mobile/tests/android_smoke.py GSM-Android-0.2.0-alpha.apk
    - name: Keep owned emulator diagnostics when validation fails
      if: failure()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: gsm-android-validation-${{ github.run_id }}
        retention-days: 1
        if-no-files-found: ignore
        path: 'GSM-Android-0.2.0-alpha.apk

          SHA256SUMS-Android.txt

          android-*.png

          android-replay-smoke.mp4

          android-failed-ui.xml

          '
    - name: Publish validated Android APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python3 - <<'PY'\nfrom pathlib import Path\nPath('android-release-notes.md').write_text('GSM para Android — 0.2.0\
        \ alpha\\n\\nTema GSM clássico, biblioteca de clipes e prints, álbuns, marcadores, lixeira, conversas e integração\
        \ com a conta/nuvem GSM. Replay e gravação de tela nativos, com autorização do Android.\\n\\nAPK independente: não\
        \ precisa de Expo Go ou de computador para abrir. Inclui ARM de 32/64 bits e x86_64. Instale o arquivo GSM-Android-0.2.0-alpha.apk.\\\
        n\\nValidado em emulador Android 15: navegação, gravação/replay e print decodificados. Versão alpha para teste em\
        \ aparelhos reais; não é uma publicação na Play Store. Álbuns e aparência são locais ao celular. A captura de áudio\
        \ interno depende das permissões do aplicativo capturado.\\n')\nPY\nif gh release view android-v0.2.0-alpha --repo\
        \ \"$GITHUB_REPOSITORY\" >/dev/null 2>&1; then\n  echo 'Android release already exists; refusing replacement.'\n \
        \ exit 1\nfi\ngh release create android-v0.2.0-alpha GSM-Android-0.2.0-alpha.apk SHA256SUMS-Android.txt --repo \"\
        $GITHUB_REPOSITORY\" --title 'GSM Android 0.2.0 alpha' --notes-file android-release-notes.md --prerelease --latest=false\n"
    - name: Remove transient signing material
      if: always()
      run: rm -f android-private-build.json
'on':
  push:
    branches:
    - main
    paths:
    - android-validation-request.json
